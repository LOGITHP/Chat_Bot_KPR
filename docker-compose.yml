services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: campus_assistant_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_DB_NAME:-campus_assistant_db}
    volumes:
      - mongodb_data:/data/db
    networks:
      - campus_network

  # 2. MinIO Object Storage
  minio:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: campus_assistant_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - campus_network

  # 3. MinIO Bucket Initialization Job
  createbuckets:
    image: minio/mc
    container_name: campus_assistant_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb myminio/$${MINIO_BUCKET:-campus-documents};
      /usr/bin/mc anonymous set download myminio/$${MINIO_BUCKET:-campus-documents};
      exit 0;
      "
    networks:
      - campus_network

  # 4. Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: campus_assistant_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - campus_network

  # 5. Ollama LLM Server
  ollama:
    image: ollama/ollama:latest
    container_name: campus_assistant_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - campus_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Fallback if no GPU: the deploy section can be safely ignored by docker compose if no GPU is present or nvidia runtime is not installed

  # 6. FastAPI Backend Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus_assistant_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb
      - minio
      - qdrant
      - ollama
    networks:
      - campus_network

  # 7. React Frontend Application - User
  frontend-user:
    build:
      context: ./frontend
      dockerfile: apps/user/Dockerfile
    container_name: campus_assistant_frontend_user
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - campus_network

  # 8. React Frontend Application - Admin
  frontend-admin:
    build:
      context: ./frontend
      dockerfile: apps/admin/Dockerfile
    container_name: campus_assistant_frontend_admin
    restart: always
    ports:
      - "5174:80"
    depends_on:
      - backend
    networks:
      - campus_network

networks:
  campus_network:
    driver: bridge

volumes:
  mongodb_data:
  minio_data:
  qdrant_data:
  ollama_data:
